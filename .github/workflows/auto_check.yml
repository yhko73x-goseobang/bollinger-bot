name: Hourly Bollinger Check

on:
  schedule:
    - cron: '0 * * * *'  # 매 정각(1시간마다) 자동 실행
  workflow_dispatch:      # 수동으로도 테스트 실행 가능

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas yfinance requests

      - name: Run script
        run: |
          python scheduler.py
